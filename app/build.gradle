plugins { id 'com.android.application' }

android {
    namespace 'com.example.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.tvhome'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug   // so the release APK installs without a keystore
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
